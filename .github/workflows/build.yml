name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Preflight and generate Java from sheets
        run: python3 -I tools/gen.py
      - name: Build the mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: siege-block-squad-jar
          path: build/libs/*.jar
